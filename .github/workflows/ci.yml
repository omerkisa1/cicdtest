name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: PYTHONPATH=. pytest tests/ -v

  build:
   needs: test
   runs-on: ubuntu-latest
   if: github.event_name == 'push'
   steps:
     - name: Checkout code
       uses: actions/checkout@v4

     - name: Build Docker image
       run: docker build -t cicd-demo:${{ github.sha }} .

     - name: Verify image
       run: docker images cicd-demo
